<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edge Spawning + Tail Follow Flow Field Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #020205;
      overflow: hidden;
      touch-action: none;
      cursor: crosshair;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let width, height, heartScale;
    let particles = [];
    const NUM_PARTICLES = 1450;
    let time = 0;

    const NUM_JOINTS = 42;
    const SEG_DIST = 10;
    const joints = [];

    let heartCenter = { x: 0, y: 0 };
    let isHeartFormed = true;
    let dragTimer = null;

    const pointer = {
      x: 0,
      y: 0,
      active: false,
      isDown: false
    };

    function initJoints(x, y) {
      joints.length = 0;
      for (let i = 0; i < NUM_JOINTS; i++) {
        joints.push({ x: x - i * SEG_DIST, y: y, angle: 0 });
      }
    }

    function breakHeart() {
      if (!isHeartFormed) return;
      isHeartFormed = false;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.isLocked) {
          p.isLocked = false;
          const burstAngle = Math.random() * Math.PI * 2;
          const force = 1.3 + Math.random() * 2.2;
          p.vx = Math.cos(burstAngle) * force;
          p.vy = Math.sin(burstAngle) * force;
          p.age = Math.floor(p.maxAge * 0.25);
        }
      }
    }

    function formHeartAt(x, y) {
      heartCenter.x = x;
      heartCenter.y = y;
      isHeartFormed = true;

      for (let i = 0; i < particles.length; i++) {
        particles[i].t = Math.random() * Math.PI * 2;
      }
    }

    function onPointerMove(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      pointer.x = clientX;
      pointer.y = clientY;
      pointer.active = true;

      breakHeart();

      clearTimeout(dragTimer);
      dragTimer = setTimeout(() => {
        if (pointer.active) {
          formHeartAt(pointer.x, pointer.y);
        }
      }, 350);
    }

    function onPointerDown(e) {
      pointer.isDown = true;
      onPointerMove(e);
    }

    function onPointerUp() {
      pointer.isDown = false;
      clearTimeout(dragTimer);
      if (pointer.active) {
        formHeartAt(pointer.x, pointer.y);
      }
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    window.addEventListener('mouseleave', () => {
      pointer.active = false;
      clearTimeout(dragTimer);
    });

    function getHeartPos(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;

      if (heartCenter.x === 0 && heartCenter.y === 0) {
        heartCenter.x = width / 2;
        heartCenter.y = height / 2 - 10;
        pointer.x = heartCenter.x;
        pointer.y = heartCenter.y;
        initJoints(heartCenter.x, heartCenter.y);
      }

      heartScale = Math.min(width, height) / 95;

      ctx.fillStyle = '#020205';
      ctx.fillRect(0, 0, width, height);
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.reset(true);
      }

      reset(init = false) {
        const edge = Math.floor(Math.random() * 4);
        const pad = 25;

        if (edge === 0) {
          this.x = Math.random() * width;
          this.y = -pad;
        } else if (edge === 1) {
          this.x = Math.random() * width;
          this.y = height + pad;
        } else if (edge === 2) {
          this.x = -pad;
          this.y = Math.random() * height;
        } else {
          this.x = width + pad;
          this.y = Math.random() * height;
        }

        this.jointIdx = Math.floor(Math.random() * NUM_JOINTS);
        this.vx = 0;
        this.vy = 0;

        this.t = Math.random() * Math.PI * 2;
        this.age = init ? Math.floor(Math.random() * 260) : 0;
        this.maxAge = 260 + Math.random() * 140;

        this.speed = 0.42 + Math.random() * 0.32;
        this.baseHue = (this.t * (180 / Math.PI) + 280) % 360;
        this.isLocked = false;
        this.prevX = this.x;
        this.prevY = this.y;
      }

      update(t) {
        let fx = 0;
        let fy = 0;

        if (isHeartFormed) {
          const ideal = getHeartPos(this.t);
          const targetX = heartCenter.x + ideal.x * heartScale;
          const targetY = heartCenter.y + ideal.y * heartScale;

          const dx = targetX - this.x;
          const dy = targetY - this.y;
          const dist = Math.hypot(dx, dy);

          if (dist < 5.5) {
            this.isLocked = true;
          }

          if (this.isLocked) {
            this.x += (targetX - this.x) * 0.35;
            this.y += (targetY - this.y) * 0.35;
            this.t = (this.t + 0.007) % (Math.PI * 2);
          } else {
            const angle = Math.atan2(dy, dx);
            fx += Math.cos(angle) * 0.58;
            fy += Math.sin(angle) * 0.58;
          }
        } else {
          this.isLocked = false;
          const targetJoint = joints[this.jointIdx] || joints[0];
          const dx = targetJoint.x - this.x;
          const dy = targetJoint.y - this.y;
          const dist = Math.hypot(dx, dy);

          if (dist > 4) {
            const angle = Math.atan2(dy, dx);
            fx += Math.cos(angle) * 0.85;
            fy += Math.sin(angle) * 0.85;
          }

          const wave = Math.sin(time * 3 + this.jointIdx * 0.3) * 0.35;
          const perpAngle = targetJoint.angle + Math.PI / 2;
          fx += Math.cos(perpAngle) * wave;
          fy += Math.sin(perpAngle) * wave;
        }

        if (!this.isLocked) {
          this.vx = (this.vx + fx) * 0.91;
          this.vy = (this.vy + fy) * 0.91;

          this.x += this.vx * this.speed;
          this.y += this.vy * this.speed;
        }

        const prevX = this.prevX;
        const prevY = this.prevY;
        this.age++;

        const progress = this.age / this.maxAge;
        const alpha = Math.sin(progress * Math.PI) * (this.isLocked ? 0.95 : 0.55);
        const liveHue = (this.baseHue + progress * 30 + t * 15) % 360;

        ctx.strokeStyle = `hsla(${liveHue}, 95%, ${this.isLocked ? '70%' : '65%'}, ${alpha})`;
        ctx.lineWidth = this.isLocked ? 1.35 : 0.85;

        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();

        this.prevX = this.x;
        this.prevY = this.y;

        if (
          this.age >= this.maxAge ||
          this.x < -50 || this.x > width + 50 ||
          this.y < -50 || this.y > height + 50
        ) {
          this.reset(false);
        }
      }
    }

    for (let i = 0; i < NUM_PARTICLES; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.fillStyle = 'rgba(2, 2, 5, 0.035)';
      ctx.fillRect(0, 0, width, height);

      time += 0.015;

      const head = joints[0];
      const targetPoint = pointer.active ? pointer : heartCenter;
      head.x += (targetPoint.x - head.x) * 0.12;
      head.y += (targetPoint.y - head.y) * 0.12;

      for (let i = 1; i < NUM_JOINTS; i++) {
        const prev = joints[i - 1];
        const curr = joints[i];

        const dx = prev.x - curr.x;
        const dy = prev.y - curr.y;
        curr.angle = Math.atan2(dy, dx);

        curr.x = prev.x - Math.cos(curr.angle) * SEG_DIST;
        curr.y = prev.y - Math.sin(curr.angle) * SEG_DIST;
      }

      for (let i = 0; i < particles.length; i++) {
        particles[i].update(time);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
